<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fan Club</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- メインページ -->
  <div id="memberPage" class="min-h-screen flex items-center justify-center">

    <div class="bg-white rounded-[32px] p-10 shadow-xl w-[420px]">
      <h1 class="text-5xl font-black text-slate-900">
        FAN CLUB
      </h1>

      <p class="text-slate-500 mt-2 mb-8">
        Official Community
      </p>

      <div class="space-y-4">

        <div class="border rounded-2xl p-4">
          会員番号：000001
        </div>

        <div class="border rounded-2xl p-4">
          ランク：村人
        </div>

        <div class="border rounded-2xl p-4">
          継続期間：1年目
        </div>

      </div>
    </div>

  </div>

  <!-- ログイン -->
  <div
    id="loginPage"
    style="
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f4f4f7;
      z-index:9999;
    "
  >

    <div
      style="
        width:380px;
        background:white;
        border-radius:28px;
        padding:40px;
        box-shadow:0 20px 60px rgba(0,0,0,0.12);
      "
    >

      <h1
        style="
          font-size:32px;
          font-weight:900;
          color:#111827;
          margin-bottom:10px;
        "
      >
        FAN CLUB
      </h1>

      <p
        style="
          color:#64748b;
          margin-bottom:30px;
        "
      >
        Official Community Login
      </p>

      <input
        id="email"
        type="email"
        placeholder="メールアドレス"
        style="
          width:100%;
          padding:16px;
          border-radius:16px;
          border:1px solid #e5e7eb;
          margin-bottom:14px;
          font-size:16px;
        "
      />

      <input
        id="password"
        type="password"
        placeholder="パスワード"
        style="
          width:100%;
          padding:16px;
          border-radius:16px;
          border:1px solid #e5e7eb;
          margin-bottom:20px;
          font-size:16px;
        "
      />

      <button
        onclick="registerUser()"
        style="
          width:100%;
          padding:16px;
          border:none;
          border-radius:16px;
          background:#8b5cf6;
          color:white;
          font-weight:700;
          font-size:16px;
          margin-bottom:12px;
          cursor:pointer;
        "
      >
        新規登録
      </button>

      <button
        onclick="loginUser()"
        style="
          width:100%;
          padding:16px;
          border:none;
          border-radius:16px;
          background:#111827;
          color:white;
          font-weight:700;
          font-size:16px;
          cursor:pointer;
        "
      >
        ログイン
      </button>

    </div>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
