```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fan Club</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">


</head>
<body>

  <div class="min-h-screen flex flex-col lg:flex-row gap-6 p-6">

    <div class="w-full lg:w-[260px] space-y-5">

      <div class="bg-white rounded-3xl p-6 shadow-sm">
        <h1 class="text-4xl font-black tracking-[0.3em] text-slate-900">FAN CLUB</h1>
        <p class="text-slate-500 tracking-[0.25em] mt-2">OFFICIAL COMMUNITY</p>
      </div>

      <div class="bg-white rounded-3xl p-6 shadow-sm">
        <h2 class="text-4xl font-bold">会員情報</h2>
        <p class="text-slate-500 mt-2">登録情報の確認・編集</p>
      </div>

      <div class="bg-white rounded-3xl p-6 shadow-sm">
        <h2 class="text-4xl font-bold">ステータス</h2>
        <p class="text-slate-500 mt-2">ランク・継続期間を確認</p>
      </div>

      <div class="bg-white rounded-3xl p-6 shadow-sm">
        <h2 class="text-4xl font-bold">お知らせ</h2>
        <p class="text-slate-500 mt-2">最新情報をチェック</p>
      </div>

    </div>

    <div class="flex-1">

      <div class="card-bg rounded-[40px] text-white p-10 overflow-hidden relative">

        <p class="tracking-[0.4em] text-slate-300">OFFICIAL COMMUNITY</p>

        <div class="grid lg:grid-cols-2 gap-10 items-center mt-5">

          <div>
            <h2 class="text-7xl font-black leading-none bg-gradient-to-b from-violet-300 to-white bg-clip-text text-transparent">
              DIGITAL<br />MEMBER<br />CARD
            </h2>

            <div class="mt-12">
              <p class="text-5xl font-black">isseiinada</p>

              <div class="mt-10">
                <p class="tracking-[0.3em] text-slate-400">MEMBER NO.</p>
                <p class="text-8xl font-black mt-3">000001</p>
              </div>

              <p class="mt-8 text-2xl tracking-[0.2em]">SINCE 2026.05.14</p>
            </div>
          </div>

          <div class="flex flex-col items-center justify-center">

            <img
              class="profile-image"
              src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop"
              alt="profile"
            />

            <div class="mt-8 flex flex-col gap-4 w-full max-w-[220px]">

              <div class="border border-violet-400 rounded-full py-4 text-center text-3xl font-bold bg-white/5 backdrop-blur">
                村人
              </div>

              <div class="border border-slate-600 rounded-full py-4 text-center text-3xl font-bold bg-white/5 backdrop-blur">
                1年目
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>

    <div class="w-full lg:w-[320px]">

      <div class="bg-white rounded-[40px] p-8 shadow-sm">

        <h2 class="text-5xl font-black text-slate-900">ステータス</h2>

        <div class="mt-10 border-b pb-8">
          <p class="text-slate-500 text-2xl">現在のランク</p>
          <p class="text-6xl font-black mt-3">村人</p>
        </div>

        <div class="mt-8 border-b pb-8">
          <p class="text-slate-500 text-2xl">会員番号</p>
          <p class="text-5xl font-black mt-3">No.000001</p>
        </div>

        <div class="mt-8">
          <p class="text-slate-500 text-2xl">次のランクまで</p>
          <p class="text-6xl font-black mt-3">あと3ヶ月</p>
        </div>

        <button class="w-full mt-10 border-2 border-violet-400 text-violet-500 rounded-full py-5 text-3xl font-bold hover:bg-violet-500 hover:text-white transition">
          ランクについて
        </button>

      </div>

    </div>

  </div>

<div id="authBox"
style="
position:fixed;
bottom:20px;
right:20px;
background:white;
padding:20px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
display:flex;
flex-direction:column;
gap:10px;
width:260px;
z-index:999999;
">

  <input
    id="email"
    type="email"
    placeholder="メールアドレス"
    style="padding:12px;border:1px solid #ddd;border-radius:10px;"
  />

  <input
    id="password"
    type="password"
    placeholder="パスワード"
    style="padding:12px;border:1px solid #ddd;border-radius:10px;"
  />

  <button
    onclick="registerUser()"
    style="padding:12px;background:#8b5cf6;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;"
  >
    会員登録
  </button>

  <button
    onclick="loginUser()"
    style="padding:12px;background:#111827;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;"
  >
    ログイン
  </button>

</div>
  
<script type="module" src="app.js"></script>

<div style="position:fixed;top:20px;right:20px;background:white;padding:20px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);z-index:99999;width:260px;">

  <h3 style="margin-top:0;">Firebaseログイン</h3>

  <input
    id="email"
    type="email"
    placeholder="メールアドレス"
    style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;"
  />

  <input
    id="password"
    type="password"
    placeholder="パスワード"
    style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;"
  />

  <button
    onclick="registerUser()"
    style="width:100%;padding:12px;background:#8b5cf6;color:white;border:none;border-radius:10px;font-weight:bold;margin-bottom:10px;cursor:pointer;"
  >
    新規登録
  </button>

  <button
    onclick="loginUser()"
    style="width:100%;padding:12px;background:#111827;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;"
  >
    ログイン
  </button>

</div>
  
</body>
</html>
