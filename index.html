<!DOCTYPE html>
      >
        FAN CLUB
      </h1>

      <p
        style="
          color:#64748b;
          margin-bottom:30px;
        "
      >
        Official Community Login
      </p>

      <input
        id="email"
        type="email"
        placeholder="メールアドレス"
        style="
          width:100%;
          padding:16px;
          border-radius:16px;
          border:1px solid #e5e7eb;
          margin-bottom:14px;
          font-size:16px;
        "
      />

      <input
        id="password"
        type="password"
        placeholder="パスワード"
        style="
          width:100%;
          padding:16px;
          border-radius:16px;
          border:1px solid #e5e7eb;
          margin-bottom:20px;
          font-size:16px;
        "
      />

      <button
        onclick="registerUser()"
        style="
          width:100%;
          padding:16px;
          border:none;
          border-radius:16px;
          background:#8b5cf6;
          color:white;
          font-weight:700;
          font-size:16px;
          margin-bottom:12px;
          cursor:pointer;
        "
      >
        新規登録
      </button>

      <button
        onclick="loginUser()"
        style="
          width:100%;
          padding:16px;
          border:none;
          border-radius:16px;
          background:#111827;
          color:white;
          font-weight:700;
          font-size:16px;
          cursor:pointer;
        "
      >
        ログイン
      </button>

    </div>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
