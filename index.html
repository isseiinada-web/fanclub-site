<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>FAN CLUB</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <!-- LOGIN -->

  <main
    id="loginPage"
    class="login-page"
  >

    <section class="login-card">

      <div class="login-mark">
        FC
      </div>

      <p class="eyebrow">
        OFFICIAL COMMUNITY
      </p>

      <h1>
        FAN CLUB
      </h1>

      <p class="login-lead">
        会員専用ページへログイン
      </p>

      <label>
        メールアドレス
      </label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
      />

      <label>
        パスワード
      </label>

      <input
        id="password"
        type="password"
        placeholder="6文字以上"
      />

      <button
        class="primary-btn"
        onclick="loginUser()"
      >
        ログイン
      </button>

      <button
        class="dark-btn"
        onclick="registerUser()"
      >
        新規会員登録
      </button>

      <button
        class="link-btn"
        onclick="resetPassword()"
      >
        パスワードを忘れた方
      </button>

      <p
        id="authMessage"
        class="auth-message"
      ></p>

    </section>

  </main>

  <!-- MEMBER PAGE -->

  <main
    id="memberPage"
    class="member-page hidden"
  >

    <header class="topbar">

      <div class="top-logo">

        <h2>
          FAN CLUB
        </h2>

        <p>
          OFFICIAL COMMUNITY
        </p>

      </div>

      <div class="top-actions">

        <div class="notify">
          🔔
        </div>

        <div class="mypage-mini">

          <span>
            マイページ
          </span>

          <strong id="sideMemberNo">
            No.000001
          </strong>

        </div>

        <button
          class="logout-btn"
          onclick="logoutUser()"
        >
          ログアウト
        </button>

      </div>

    </header>

    <section class="dashboard">

      <!-- LEFT -->

      <aside class="left-menu">

        <div class="menu-logo">

          <h2>
            FAN<br>
            CLUB
          </h2>

          <p>
            OFFICIAL<br>
            COMMUNITY
          </p>

        </div>

        <button
          class="nav-card active"
          data-panel="card"
          onclick="showPanel('card')"
        >

          <strong>
            デジタル会員証
          </strong>

          <span>
            会員カードを表示
          </span>

        </button>

        <button
          class="nav-card"
          data-panel="profile"
          onclick="showPanel('profile')"
        >

          <strong>
            会員情報
          </strong>

          <span>
            プロフィール編集
          </span>

        </button>

      </aside>

      <!-- CENTER -->

      <section class="main-content">

        <!-- CARD -->

        <section
          id="panel-card"
          class="screen-panel active-panel"
        >

          <div class="member-card">

            <div class="member-left">

              <p class="eyebrow">
                OFFICIAL COMMUNITY
              </p>

              <h1>
                DIGITAL<br>
                MEMBER<br>
                CARD
              </h1>

              <h2 id="memberName">
                member
              </h2>

              <p class="small-title">
                MEMBER NO.
              </p>

              <div
                class="big-number"
                id="memberNumber"
              >
                000001
              </div>

              <p
                class="since"
                id="registerDate"
              >
                SINCE 2026.05.16
              </p>

              <p class="fan-id">
                FAN CLUB ID
              </p>

            </div>

            <div class="member-right">

              <div class="avatar-ring">

                <img
                  id="avatarImage"
                  src="./villager-icon.jpg"
                />

              </div>

              <div
                class="status-chip"
                id="memberRank"
              >
                村人
              </div>

              <div
                class="status-chip dark"
                id="yearLabel"
              >
                1年目
              </div>

            </div>

          </div>

        </section>

        <!-- PROFILE -->

        <section
          id="panel-profile"
          class="screen-panel"
        >

          <div class="settings-card">

            <h3>
              プロフィール編集
            </h3>

            <p class="muted">
              会員証に表示される情報を変更できます。
            </p>

            <label>
              ニックネーム
            </label>

            <input
              id="nicknameInput"
              class="settings-input"
              type="text"
              placeholder="ニックネーム"
            />

            <!-- 画像アップロード -->

            <div class="profile-upload">

              <label>
                プロフィール画像
              </label>

              <input
                type="file"
                id="avatarUpload"
                accept="image/*"
              />

            </div>

            <button
              class="save-btn"
              onclick="saveProfile()"
            >
              保存する
            </button>

          </div>

        </section>

      </section>

      <!-- RIGHT -->

      <aside class="status-panel">

        <h2>
          ステータス
        </h2>

        <div class="status-block">

          <p>
            現在のランク
          </p>

          <h3 id="rankText">
            村人
          </h3>

          <span id="nextRank">
            あと3ヶ月
          </span>

        </div>

      </aside>

    </section>

  </main>

  <script
    type="module"
    src="app.js"
  ></script>

</body>

</html>
